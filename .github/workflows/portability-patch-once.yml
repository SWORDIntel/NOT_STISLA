name: Guarded one-shot KEYSTONE portability patch

on:
  push:
    branches:
      - security/trigram-qihse-hardening-20260908

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.event.head_commit.message == 'chore: apply guarded portability patch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: security/trigram-qihse-hardening-20260908
          fetch-depth: 0

      - name: Apply exact guarded replacements
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {n}')
              return text.replace(old, new, 1)

          tri = Path('src/keystone_trigram.c')
          text = tri.read_text()
          text = once(text,
              '    return (size_t)(h & (uint32_t)(num_buckets - 1u));',
              '    return (size_t)h & (num_buckets - 1u);',
              'trigram hash mask')
          text = once(text,
              'static bool checked_add_size(size_t a, size_t b, size_t* out) {\n    if (!out || b > SIZE_MAX - a) return false;\n    *out = a + b;\n    return true;\n}\n',
              'static bool checked_add_size(size_t a, size_t b, size_t* out) {\n    if (!out || b > SIZE_MAX - a) return false;\n    *out = a + b;\n    return true;\n}\n\nstatic size_t max_document_count(void) {\n    size_t max_docs = (size_t)UINT32_MAX;\n    if (sizeof(size_t) > sizeof(uint32_t)) max_docs += 1u;\n    return max_docs;\n}\n',
              'max document helper')
          text = once(text,
              '    if (initial_doc_capacity > (size_t)UINT32_MAX + 1u) return NULL;',
              '    if (initial_doc_capacity > max_document_count()) return NULL;',
              'initial capacity bound')
          text = once(text,
              '    size_t max_docs = (size_t)UINT32_MAX + 1u;',
              '    size_t max_docs = max_document_count();',
              'growth capacity bound')
          tri.write_text(text)

          src = Path('src/keystone.c')
          text = src.read_text()
          text = once(text,
              '#include <errno.h>\n',
              '#include <errno.h>\n#include <stdatomic.h>\n',
              'stdatomic include')
          replacements = [
              ('__atomic_load_n(&cpu_features_detected, __ATOMIC_ACQUIRE)', 'atomic_load_explicit(&cpu_features_detected, memory_order_acquire)', 'cpu detected load'),
              ('__atomic_store_n(&cpu_features_detected, 1, __ATOMIC_RELEASE)', 'atomic_store_explicit(&cpu_features_detected, 1, memory_order_release)', 'cpu detected store'),
              ('__atomic_fetch_add(&g_stats_next_slot, 1, __ATOMIC_RELAXED)', 'atomic_fetch_add_explicit(&g_stats_next_slot, 1, memory_order_relaxed)', 'stats slot fetch-add'),
              ('__atomic_load_n(&g_stats_active_idx, __ATOMIC_ACQUIRE)', 'atomic_load_explicit(&g_stats_active_idx, memory_order_acquire)', 'active buffer load'),
              ('__atomic_fetch_add(&g_stats_writers[buf], 1, __ATOMIC_RELAXED)', 'atomic_fetch_add_explicit(&g_stats_writers[buf], 1, memory_order_relaxed)', 'writer increment'),
              ('__atomic_fetch_sub(&g_stats_writers[buf], 1, __ATOMIC_RELAXED)', 'atomic_fetch_sub_explicit(&g_stats_writers[buf], 1, memory_order_relaxed)', 'writer decrement'),
              ('__atomic_store_n(&g_stats_anchors_learned, anchors_learned, __ATOMIC_RELAXED)', 'atomic_store_explicit(&g_stats_anchors_learned, anchors_learned, memory_order_relaxed)', 'anchors learned store'),
              ('__atomic_store_n(&g_stats_anchors_pruned, anchors_pruned, __ATOMIC_RELAXED)', 'atomic_store_explicit(&g_stats_anchors_pruned, anchors_pruned, memory_order_relaxed)', 'anchors pruned store'),
              ('__atomic_store_n(&g_stats_active_idx, new_buf, __ATOMIC_RELEASE)', 'atomic_store_explicit(&g_stats_active_idx, new_buf, memory_order_release)', 'active buffer store'),
              ('__atomic_load_n(&g_stats_writers[old_buf], __ATOMIC_ACQUIRE)', 'atomic_load_explicit(&g_stats_writers[old_buf], memory_order_acquire)', 'writer quiescence load'),
              ('__atomic_load_n(&g_stats_anchors_learned, __ATOMIC_RELAXED)', 'atomic_load_explicit(&g_stats_anchors_learned, memory_order_relaxed)', 'anchors learned load'),
              ('__atomic_load_n(&g_stats_anchors_pruned, __ATOMIC_RELAXED)', 'atomic_load_explicit(&g_stats_anchors_pruned, memory_order_relaxed)', 'anchors pruned load'),
              ('__atomic_store_n(&g_stats_next_slot, 0, __ATOMIC_RELAXED)', 'atomic_store_explicit(&g_stats_next_slot, 0, memory_order_relaxed)', 'stats slot reset'),
              ('__atomic_store_n(&g_stats_active_idx, 0, __ATOMIC_RELAXED)', 'atomic_store_explicit(&g_stats_active_idx, 0, memory_order_relaxed)', 'active buffer reset'),
              ('__atomic_store_n(&g_stats_writers[0], 0, __ATOMIC_RELAXED)', 'atomic_store_explicit(&g_stats_writers[0], 0, memory_order_relaxed)', 'writer0 reset'),
              ('__atomic_store_n(&g_stats_writers[1], 0, __ATOMIC_RELAXED)', 'atomic_store_explicit(&g_stats_writers[1], 0, memory_order_relaxed)', 'writer1 reset'),
              ('__atomic_store_n(&g_stats_anchors_learned, 0, __ATOMIC_RELAXED)', 'atomic_store_explicit(&g_stats_anchors_learned, 0, memory_order_relaxed)', 'anchors learned reset'),
              ('__atomic_store_n(&g_stats_anchors_pruned, 0, __ATOMIC_RELAXED)', 'atomic_store_explicit(&g_stats_anchors_pruned, 0, memory_order_relaxed)', 'anchors pruned reset'),
              ('__atomic_store_n(&g_last_backend_decision_valid, 1, __ATOMIC_RELEASE)', 'atomic_store_explicit(&g_last_backend_decision_valid, 1, memory_order_release)', 'backend decision publish'),
              ('__atomic_load_n(&g_last_backend_decision_valid, __ATOMIC_ACQUIRE)', 'atomic_load_explicit(&g_last_backend_decision_valid, memory_order_acquire)', 'backend decision load'),
          ]
          for old, new, label in replacements:
              n = text.count(old)
              if n < 1:
                  raise SystemExit(f'{label}: expected at least 1 match, got {n}')
              text = text.replace(old, new)
          src.write_text(text)
          PY

      - name: Validate patch shape
        shell: bash
        run: |
          git diff --check
          grep -F '#include <stdatomic.h>' src/keystone.c
          ! grep -E '__atomic_(load_n|store_n|fetch_add|fetch_sub).*g_stats|__atomic_(load_n|store_n).*cpu_features_detected|__atomic_(load_n|store_n).*g_last_backend_decision_valid' src/keystone.c
          grep -F 'return (size_t)h & (num_buckets - 1u);' src/keystone_trigram.c
          grep -F 'max_document_count()' src/keystone_trigram.c
          cc -std=c11 -Iinclude -Isrc -fsyntax-only src/keystone_trigram.c
          clang -std=c11 -Iinclude -Isrc -fsyntax-only src/keystone.c

      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/keystone.c src/keystone_trigram.c
          git commit -m 'fix: make atomics and trigram bounds C11 portable'
          git push origin HEAD:security/trigram-qihse-hardening-20260908
